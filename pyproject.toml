[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dronecalc"
version = "0.1.0"
description = "Multirotor sizing: mission requirements to ranked feasible builds"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
ui = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "ruff>=0.4",
]

[project.scripts]
dronecalc = "dronecalc.cli:main"

[project.gui-scripts]
dronecalc-gui = "dronecalc.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py39"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
